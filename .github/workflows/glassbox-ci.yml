name: Glassbox downstream CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glassbox-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 -B extensionalities/scripts/ci.py changes

  format:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: rustup default stable
      - run: python3 -B extensionalities/scripts/ci.py format

  workflows:
    name: Workflow validation
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B extensionalities/scripts/ci.py workflows

  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/extensionalities/target/ci
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native dependencies and English OCR data
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libtesseract-dev libleptonica-dev tesseract-ocr-eng
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup default stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
          key: glassbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'extensionalities/Cargo.lock') }}
      - run: python3 -B extensionalities/scripts/ci.py check

  gate:
    name: Glassbox downstream gate
    if: always()
    needs: [changes, format, workflows, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable downstream job
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.run }}
          FORMAT: ${{ needs.format.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          python3 - <<'PY'
          import os
          assert os.environ["CHANGES"] == "success", "Change detection failed"
          required = os.environ["REQUIRED"]
          assert required in ("true", "false"), "Missing change-detection result"
          expected = "success" if required == "true" else "skipped"
          assert os.environ["FORMAT"] == expected, "Formatting did not pass"
          assert os.environ["WORKFLOWS"] == expected, "Workflow validation did not pass"
          assert os.environ["CHECKS"] == expected, "Build/test matrix did not pass"
          PY
