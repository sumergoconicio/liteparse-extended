[package]
name = "litx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "glassbox"
description = "Glassbox: local file inspection and extraction"

[[bin]]
name = "glassbox"
path = "src/main.rs"

[[bin]]
name = "litx"
path = "src/bin/litx.rs"

[features]
default = []
magika = ["litx-inspect/magika"]
ffmpeg-link = ["litx-inspect/ffmpeg-link"]

[dependencies]
litx-inspect = { path = "../litx-inspect" }
liteparse = { path = "../../../crates/liteparse", features = ["tesseract"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
